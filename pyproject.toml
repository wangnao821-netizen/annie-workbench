[project]
name = "vera-workbench"
version = "2.3.3"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "spacy>=3.7",
    "python-dotenv>=1.0",
    "apscheduler>=3.10",
    "liteparse>=1.0.0",
    "openpyxl>=3.1",
    "oletools>=0.6",
    "python-multipart>=0.0.32",
    "sqlite-vec>=0.1.9",
    "fastembed>=0.8.0",
    "pydantic-ai>=2.29.0,<3",
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "pypdf>=4.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "alembic>=1.13",
]
