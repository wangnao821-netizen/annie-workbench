[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# Default target DB. At runtime core/models/db.py overrides it via
# set_main_option("sqlalchemy.url", ...); tests can override via the
# ALEMBIC_DB_URL environment variable.
sqlalchemy.url = sqlite:///data/assistant.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
