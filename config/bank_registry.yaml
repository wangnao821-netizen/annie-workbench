# 银行主数据注册表（WO-22 定稿 2026-08-13）
#
# 结构契约：
#   - display_name 必须与 config/lender_policies.yaml 顶层键逐字一致（20 家），
#     保证政策引擎/佣金按 display_name 查找零改动；boc / ma_money 无政策档。
#   - tier: full（A 层 9 家置顶）| basic（B 层 13 家基础档）
#   - calculator_profile 仅 6 家非 null（cba/macquarie/boc/ma_money/latrobe/resimac），
#     对应 config/calculator/<key>.yaml。
#   - vera_confirmed=false 表示 Vera 尚未在设置页确认（仅作 UI 过滤建议，不算合规结论）。
# 本文件为本地配置，不含 PII；解析只做字符串规范化，不调 LLM、不访问网络。
#
# 校验：core/bank_registry.load_registry() 加载时强制（失败抛 ValueError）。

