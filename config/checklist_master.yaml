# 全量清单主库（V5 三层模型 · 全集层）
# 结构按 docs/task_workbench_design.md §4.2：
#   全集 →（master_picker 规则+AI 硬过滤/预选）→ AI 预选 → Vera 微调
# category 枚举: identity / income_payg / income_self_employed /
#               bank_specific / special / property / settlement
# applicable_when 取值为 all 或条件键（residency / employment_type /
#               purpose / deposit_source_includes / income_sources），
#               多键同时满足才适用。bank_specific 仅目标银行匹配时出现。
# aliases 与 core/pipeline/classifier.py 分类标签对齐。

items:
  # ── identity 身份 ──
  - id: passport
    name_zh: 有效护照
    name_en: Passport
    category: identity
    aliases: [passport, travel_document]
    applicable_when: { all: true }

  - id: driver_license
    name_zh: 驾照
    name_en: Driver Licence
