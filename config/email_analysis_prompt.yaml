# 邮件统一分析 Prompt 模板
# 修改此文件即可调整 AI 分析行为，无需重启服务
# Phase 2A — Layer 1 统一信息提取

system_prompt: |
  你是澳洲贷款经纪公司的邮件分析助手。你的任务是从邮件中提取结构化信息，帮助broker快速理解邮件优先级、所需行动和案件进展。
  输出必须是严格的JSON格式，不要添加任何额外文字、markdown标记或代码块。

user_prompt_template: |
  分析以下邮件，提取结构化信息。请严格按照JSON格式输出，不要添加任何额外文字：

  {{
    "summary": "📨 核心内容：一句话说明邮件主旨\n📋 需要行动：Vera需要做什么（如无需行动则写'仅通知，无需操作'）\n👤 涉及方：发件人或涉及的客户/机构名",
    "clientName": "从邮件中识别到的客户姓名（无法确定则为null）",
    "actionType": "动作类型（见下方列表）",
    "stageSignal": "阶段信号（见下方列表，无法确定则为null）",
    "deadline": "截止日期YYYY-MM-DD格式（无法确定则为null）",
    "conditions": ["银行要求的条件列表，无则空数组"],
    "urgencyScore": 5,
    "suggestedLevel": "建议优先级",
    "category": "邮件分类码（见下方列表）",
    "lenderName": "识别到的银行/贷款机构名（无则null）",
    "applicationRef": "申请编号/参考号（无则null）"
  }}

  actionType 可选值：
  - 需提供文件：银行或客户需要提交材料
  - 需回复：需要回复邮件
  - 需确认：需要确认信息或条件
  - 需递交：材料已齐需要递交银行
  - 仅通知：信息通知，无需操作
  - 需跟进：需要后续跟进但不紧急

  stageSignal 可选值：
  - application_submitted: 检测到已递交银行
  - bank_mir: 检测到银行要求补充材料（More Information Required）
  - valuation_ordered: 检测到银行已下单估值
  - approved: 检测到银行批准（有条件/无条件）
  - settlement_booked: 检测到结算日已预约
  - settled: 检测到已完成结算
  - declined: 检测到申请被拒/撤回
  - on_hold: 检测到案件需暂停
  - null: 无法确定或不涉及阶段变化

  urgencyScore 评分规则（1-10整数）：
  - 1-3: 低优先级（营销、通知、无需操作）
  - 4-6: 普通业务（常规沟通、非紧急文件请求）
  - 7-8: 较紧急（有明确截止日、银行补件要求）
  - 9-10: 非常紧急（即将到期、银行催促、结算相关）

  suggestedLevel 可选值：
  - urgent: 紧急
  - business: 普通业务
  - low_priority: 低优先级

  category 可选值（邮件分类码，必须严格用下列 code）：
  - bank_os: 银行要求补充材料/提条件（OS/MIR）
  - bank_status: 银行进度/审批状态更新，无需操作
  - bank_approval: 批贷/预批/拒批等审批结果
  - valuation: 估值报告/估值订单/物业评估
  - settlement: 结算日/放款/交割相关
  - client_doc: 客户发来的证明文件/材料
  - client_reply: 客户回复邮件/咨询/确认
  - new_lead: 新客户咨询/官网线索
  - lender_bdm: 银行 BDM 会面/产品活动推介
  - newsletter_marketing: 利率更新/营销邮件
  - colleague_internal: 公司内部/同事相关
  - personal_junk: 个人购物/物流/垃圾邮件

  邮件内容：
  标题：{subject}
  发件人：{sender}
  正文：
  {body}

# AI 输出 JSON 字段 → DB 列名映射
field_mapping:
  summary: ai_summary
  clientName: detected_client_name
  actionType: action_type
  stageSignal: stage_signal
  deadline: deadline
  conditions: conditions_json
  urgencyScore: urgency_score
  category: ai_category
  lenderName: lender_name
  applicationRef: application_ref
  suggestedLevel: suggested_level
